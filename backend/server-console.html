<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖥️ 服务控制台 - 家庭报销管理系统</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: #0a0e14;
        color: #b3b1ad;
        font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.6;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ===== 顶部状态栏 ===== */
    #statusBar {
        background: #111820;
        border-bottom: 1px solid #2a2f3a;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        flex-wrap: wrap;
        gap: 6px;
    }
    #statusBar .title {
        color: #e6c384;
        font-weight: bold;
        font-size: 14px;
    }
    #statusBar .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 3px;
        font-size: 11px;
        margin: 0 4px;
    }
    .badge-green { background: #1e3a2f; color: #7eca9c; }
    .badge-blue  { background: #1a2d3d; color: #7ab0df; }
    #statusInfo {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 12px;
        color: #888;
    }
    #statusInfo span { white-space: nowrap; }
    #statusInfo .val { color: #d4d4d4; }

    /* ===== 工具栏 ===== */
    #toolbar {
        background: #0d1117;
        border-bottom: 1px solid #2a2f3a;
        padding: 6px 16px;
        display: flex;
        gap: 8px;
        flex-shrink: 0;
        flex-wrap: wrap;
        align-items: center;
    }
    #toolbar button {
        background: #1a1f2a;
        color: #b3b1ad;
        border: 1px solid #2a2f3a;
        padding: 4px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        transition: all 0.15s;
    }
    #toolbar button:hover {
        background: #2a3040;
        color: #e6c384;
        border-color: #e6c384;
    }
    #toolbar button.danger:hover {
        border-color: #e67e80;
        color: #e67e80;
    }
    #toolbar .info-text {
        color: #6a6a7a;
        font-size: 11px;
        margin-left: auto;
    }
    #autoScrollToggle {
        cursor: pointer;
        user-select: none;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 3px;
        background: #1a1f2a;
        border: 1px solid #2a2f3a;
    }
    #autoScrollToggle.on { color: #7eca9c; border-color: #7eca9c; }
    #autoScrollToggle.off { color: #e67e80; border-color: #e67e80; }

    /* ===== 日志区域 ===== */
    #logContainer {
        flex: 1;
        overflow-y: auto;
        padding: 8px 16px;
        background: #0a0e14;
    }
    #logContainer::-webkit-scrollbar {
        width: 6px;
    }
    #logContainer::-webkit-scrollbar-track {
        background: #0d1117;
    }
    #logContainer::-webkit-scrollbar-thumb {
        background: #2a2f3a;
        border-radius: 3px;
    }
    #logContainer::-webkit-scrollbar-thumb:hover {
        background: #3a3f4a;
    }

    .log-line {
        white-space: pre-wrap;
        word-break: break-all;
        min-height: 1.4em;
        padding: 0 4px;
        border-radius: 2px;
    }
    .log-line:hover {
        background: #111820;
    }

    /* 不同级别的日志高亮 */
    .log-line .ts { color: #6a6a7a; }
    .log-line .info { color: #7ab0df; }
    .log-line .warn { color: #e6c384; }
    .log-line .error { color: #e67e80; }
    .log-line .success { color: #7eca9c; }
    .log-line .highlight { color: #d4d4d4; font-weight: bold; }

    /* ===== 底部统计 ===== */
    #footer {
        background: #0d1117;
        border-top: 1px solid #2a2f3a;
        padding: 4px 16px;
        font-size: 11px;
        color: #5a5a6a;
        display: flex;
        justify-content: space-between;
        flex-shrink: 0;
    }

    /* ===== 加载提示 ===== */
    #loading {
        color: #6a6a7a;
        text-align: center;
        padding: 40px;
        animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
    }
</style>
</head>
<body>

<!-- 状态栏 -->
<div id="statusBar">
    <div>
        <span class="title">🖥️ 服务控制台</span>
        <span class="badge badge-green" id="statusDot">● 运行中</span>
    </div>
    <div id="statusInfo">
        <span>PID: <span class="val" id="sPid">-</span></span>
        <span>运行时长: <span class="val" id="sUptime">-</span></span>
        <span>内存: <span class="val" id="sMemory">-</span></span>
        <span>CPU: <span class="val" id="sCpu">-</span></span>
        <span><a href="/admin/accounts" target="_blank" style="color:#7ab0df;text-decoration:none;">← 返回后台</a></span>
    </div>
</div>

<!-- 工具栏 -->
<div id="toolbar">
    <button onclick="loadLogs()">🔄 刷新</button>
    <button onclick="clearLogDisplay()" class="danger">🗑️ 清屏</button>
    <button onclick="loadServerStatus()">📊 状态</button>
    <span id="autoScrollToggle" class="on" onclick="toggleAutoScroll()">▼ 自动滚动</span>
    <span class="info-text" id="logCount">日志: 0 行</span>
</div>

<!-- 日志输出区 -->
<div id="logContainer">
    <div id="loading">⏳ 正在加载服务日志...</div>
</div>

<!-- 底部 -->
<div id="footer">
    <span id="lastUpdate">等待数据...</span>
    <span>按 Ctrl+Shift+R 手动刷新</span>
</div>

<script>
// ============================================================
// 全局状态
// ============================================================
let autoScroll = true;
let pollTimer = null;
let logLinesCache = [];

// ============================================================
// 工具函数
// ============================================================
function $(id) { return document.getElementById(id); }

function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function getTimestamp() {
    return new Date().toLocaleTimeString('zh-CN', { hour12: false });
}

// ============================================================
// 日志行颜色分类
// ============================================================
function classifyLine(text) {
    if (/❌/.test(text)) return 'error';
    if (/✅|成功|完成|已备份|已恢复|已删除|已清空/.test(text)) return 'success';
    if (/⚠️|警告/.test(text)) return 'warn';
    if (/🔐|💾|♻️|🗑️|🚀/.test(text)) return 'highlight';
    return 'info';
}

function renderLogLine(line) {
    const cls = classifyLine(line);
    const escaped = escapeHtml(line);
    // 给时间戳上色
    const colored = escaped.replace(/^(\[\d{2}:\d{2}:\d{2}\])\s*/, '<span class="ts">$1 </span>');
    return `<div class="log-line"><span class="${cls}">${colored}</span></div>`;
}

// ============================================================
// 加载日志
// ============================================================
async function loadLogs() {
    try {
        const resp = await fetch('/api/admin/server-logs');
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.message);

        const data = json.data;
        const container = $('logContainer');

        // 移除 loading
        const loading = $('loading');
        if (loading) loading.remove();

        // 判断是否有新行
        const newLines = data.lines || [];
        if (JSON.stringify(newLines) === JSON.stringify(logLinesCache)) {
            $('lastUpdate').textContent = `最后更新: ${getTimestamp()} (无变化)`;
            return;
        }

        logLinesCache = newLines;
        container.innerHTML = newLines.map(renderLogLine).join('');

        // 更新统计
        $('logCount').textContent = `日志: ${data.total} 行 (显示 ${data.showing} 行)`;
        $('lastUpdate').textContent = `最后更新: ${getTimestamp()}`;

        // 自动滚动到底部
        if (autoScroll) {
            container.scrollTop = container.scrollHeight;
        }
    } catch (e) {
        console.error('日志加载失败:', e);
        const container = $('logContainer');
        container.innerHTML += `<div class="log-line"><span class="error">❌ 日志加载失败: ${escapeHtml(e.message)}</span></div>`;
    }
}

// ============================================================
// 清屏
// ============================================================
function clearLogDisplay() {
    const container = $('logContainer');
    container.innerHTML = `<div class="log-line" style="color:#6a6a7a;">--- 屏幕已清除 --- ${getTimestamp()}</div>`;
    logLinesCache = [];
    $('logCount').textContent = '日志: 0 行';
}

// ============================================================
// 自动滚动切换
// ============================================================
function toggleAutoScroll() {
    autoScroll = !autoScroll;
    const el = $('autoScrollToggle');
    el.className = autoScroll ? 'on' : 'off';
    el.textContent = autoScroll ? '▼ 自动滚动' : '▶ 手动滚动';
    if (autoScroll) {
        const container = $('logContainer');
        container.scrollTop = container.scrollHeight;
    }
}

// ============================================================
// 服务器状态
// ============================================================
async function loadServerStatus() {
    try {
        const resp = await fetch('/api/admin/server-status');
        const json = await resp.json();
        if (json.code !== 0) throw new Error(json.message);

        const d = json.data;
        $('sPid').textContent = d.pid || '-';
        $('sUptime').textContent = d.uptime || '-';
        $('sMemory').textContent = d.memory_mb ? d.memory_mb + ' MB' : '-';
        $('sCpu').textContent = d.cpu_percent !== undefined ? d.cpu_percent + '%' : '-';

        // 追加一条状态日志
        const container = $('logContainer');
        container.innerHTML += renderLogLine(`[${getTimestamp()}] 📊 服务器状态已刷新 — PID=${d.pid} 运行=${d.uptime} 内存=${d.memory_mb || '-'}MB`);
        if (autoScroll) container.scrollTop = container.scrollHeight;
    } catch (e) {
        console.error('状态加载失败:', e);
    }
}

// ============================================================
// 初始化
// ============================================================
async function init() {
    await loadServerStatus();
    await loadLogs();
    // 每 3 秒自动轮询日志
    pollTimer = setInterval(loadLogs, 3000);
}

// 页面可见时轮询，不可见时暂停以节省资源
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    } else {
        loadServerStatus();
        loadLogs();
        if (!pollTimer) pollTimer = setInterval(loadLogs, 3000);
    }
});

init();
</script>
</body>
</html>
