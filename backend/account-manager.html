<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 28px 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; margin-bottom: 6px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
        .btn { padding: 8px 20px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #4a6cf7; color: #fff; }
        .btn-primary:hover { background: #3a5cd6; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: #2ecc71; color: #fff; }
        .btn-success:hover { background: #27ae60; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
        th { text-align: left; padding: 10px 12px; background: #f0f2f5; font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
        .form-group { flex: 1; min-width: 140px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 3px; }
        .form-group input, .form-group select { width: 100%; padding: 7px 10px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 13px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #4a6cf7; }
        .badge { padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 999; }
        .modal.open { display: flex; }
        .modal-box { background: #fff; border-radius: 16px; padding: 28px 32px; max-width: 420px; width: 90%; }
        .modal-box h3 { margin-bottom: 16px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 10px; color: #fff; font-weight: 500; z-index: 9999; box-shadow: 0 8px 24px rgba(0,0,0,0.15); animation: slideIn 0.3s ease; }
        .toast.success { background: #2ecc71; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #4a6cf7; }
        @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .empty { text-align: center; color: #aaa; padding: 30px 0; }
        .action-cell { display: flex; gap: 5px; flex-wrap: wrap; }
        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .back-link { color: #4a6cf7; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }

        /* ===== 登录屏障样式 ===== */
        .login-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
        }
        .login-overlay.hidden { display: none; }
        .login-card {
            background: #fff; border-radius: 20px; padding: 40px 36px;
            max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-card .logo { font-size: 48px; margin-bottom: 8px; }
        .login-card h2 { font-size: 22px; color: #1a1a2e; margin-bottom: 4px; }
        .login-card .login-subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
        .login-card .form-group { text-align: left; margin-bottom: 16px; }
        .login-card .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 4px; }
        .login-card .form-group input {
            width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 10px;
            font-size: 15px; transition: border-color 0.2s; outline: none;
        }
        .login-card .form-group input:focus { border-color: #667eea; }
        .login-card .btn-login {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
        }
        .login-card .btn-login:hover { opacity: 0.9; }
        .login-card .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-card .login-error { color: #e74c3c; font-size: 13px; margin-top: 12px; min-height: 20px; }
        .login-card .login-hint { color: #aaa; font-size: 12px; margin-top: 16px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .btn-logout {
            padding: 6px 16px; border: 1px solid #e0e0e0; border-radius: 8px;
            background: #fff; color: #666; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .btn-logout:hover { background: #f5f5f5; color: #e74c3c; border-color: #e74c3c; }
        .management-area { display: none; }
        .management-area.visible { display: block; }
    </style>
</head>
<body>
    <!-- ===== 登录屏障 ===== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="logo">🔐</div>
            <h2>管理员验证</h2>
            <div class="login-subtitle">请输入管理员账号和密码以继续</div>
            <div class="form-group">
                <label>管理员账号</label>
                <input type="text" id="loginUsername" placeholder="请输入管理员账号" />
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" />
            </div>
            <button class="btn-login" id="loginBtn" onclick="handleAdminLogin()">验证身份</button>
            <div class="login-error" id="loginError"></div>
            <div class="login-hint">💡 仅管理员有权访问账号管理后台</div>
        </div>
    </div>

    <!-- ===== 管理界面 ===== -->
    <div class="management-area" id="managementArea">
    <div class="container">
        <div class="admin-header">
            <div>
                <h1>👤 账号管理</h1>
                <div class="subtitle">添加、修改或删除家庭成员账号</div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <span id="adminInfo" style="font-size:13px;color:#888;"></span>
                <button class="btn-logout" onclick="handleAdminLogout()">退出登录</button>
                <a href="/" class="back-link">← 返回首页</a>
            </div>
        </div>

        <!-- 添加账号表单 -->
        <div style="background:#f8f9fc;border-radius:12px;padding:16px 20px;margin-bottom:20px;border:2px dashed #d0d5dd;">
            <h3 style="font-size:15px;margin-bottom:10px;">➕ 添加新账号</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" id="newUsername" placeholder="请输入账号" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="text" id="newPassword" placeholder="默认 123456" />
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="newName" placeholder="如：小明" />
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select id="newRole">
                        <option value="father">爸爸</option>
                        <option value="mother">妈妈</option>
                        <option value="son" selected>儿子</option>
                        <option value="daughter">女儿</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>承诺额度</label>
                    <input type="number" id="newMaxCommitment" value="100" step="10" />
                </div>
                <div class="form-group" style="min-width:100px;">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary" onclick="createUser()">添加账号</button>
                </div>
            </div>
        </div>

        <!-- 账号列表 -->
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>账号</th>
                        <th>姓名</th>
                        <th>角色</th>
                        <th>承诺额度</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="6" class="empty">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </div> <!-- /managementArea -->

    <!-- 编辑模态框 -->
    <div class="modal" id="editModal">
        <div class="modal-box">
            <h3>✏️ 编辑账号</h3>
            <input type="hidden" id="editUserId" />
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="editUsername" placeholder="请输入账号" />
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="editName" />
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="editRole">
                    <option value="father">爸爸</option>
                    <option value="mother">妈妈</option>
                    <option value="son">儿子</option>
                    <option value="daughter">女儿</option>
                </select>
            </div>
            <div class="form-group">
                <label>承诺额度</label>
                <input type="number" id="editMaxCommitment" step="10" />
            </div>
            <div class="form-group">
                <label>新密码（留空不修改）</label>
                <input type="text" id="editPassword" placeholder="留空表示不修改" />
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveEdit()">保存修改</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        const ADMIN_USERNAME = 'chaibingkun';

        // ===== Token 管理 =====
        function getAdminToken() {
            return localStorage.getItem('admin_token');
        }
        function setAdminToken(token) {
            localStorage.setItem('admin_token', token);
        }
        function clearAdminToken() {
            localStorage.removeItem('admin_token');
        }
        function getAdminInfo() {
            const info = localStorage.getItem('admin_info');
            return info ? JSON.parse(info) : null;
        }
        function setAdminInfo(info) {
            localStorage.setItem('admin_info', JSON.stringify(info));
        }
        function clearAdminInfo() {
            localStorage.removeItem('admin_info');
        }

        /**
         * 统一的 API 调用（增强版：带 Token 认证）
         */
        async function apiCall(endpoint, options = {}) {
            const requestId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            const method = options.method || 'GET';
            const url = API_BASE + endpoint;
            const config = {
                headers: { 'Content-Type': 'application/json' },
                ...options,
            };
            if (options.body) {
                config.body = JSON.stringify(options.body);
            }

            // 自动添加 token（除了登录接口）
            if (endpoint !== '/auth/login') {
                const token = getAdminToken();
                if (token) {
                    config.headers['Authorization'] = `Bearer ${token}`;
                }
            }

            console.log(`🌐 [AM ${requestId}] ${method} ${url}`);

            try {
                const startTime = Date.now();
                const response = await fetch(url, config);
                const elapsed = Date.now() - startTime;
                console.log(`⏱️ [AM ${requestId}] 响应: ${response.status} ${elapsed}ms`);

                // 检查 HTTP 状态码
                if (!response.ok) {
                    let errorMsg = `服务器返回错误状态 (${response.status})`;
                    if (response.status === 0) errorMsg = 'CORS 跨域错误，请检查后端配置';
                    else if (response.status === 401) errorMsg = '登录已过期，请重新登录';
                    else if (response.status === 404) errorMsg = `接口不存在 (${endpoint})`;
                    else if (response.status === 500) errorMsg = '服务器内部错误';
                    else if (response.status === 502) errorMsg = '后端服务不可用 (502)';
                    else if (response.status === 503) errorMsg = '后端服务维护中 (503)';
                    console.error(`❌ [AM ${requestId}] ${errorMsg}`);

                    // token 失效，跳回登录
                    if (response.status === 401) {
                        handleAdminLogout();
                        throw new Error('登录已过期，请重新登录');
                    }
                    throw new Error(errorMsg);
                }

                let data;
                try {
                    data = await response.json();
                } catch (jsonError) {
                    console.error(`❌ [AM ${requestId}] JSON 解析失败:`, jsonError);
                    throw new Error('服务器返回的数据格式异常');
                }

                if (data.code === 0) {
                    console.log(`✅ [AM ${requestId}] 请求成功`);
                    return data;
                } else if (data.code === 401) {
                    console.warn(`⚠️ [AM ${requestId}] Token 失效`);
                    handleAdminLogout();
                    throw new Error(data.message || '未授权');
                } else {
                    console.warn(`⚠️ [AM ${requestId}] 业务错误 (code=${data.code}): ${data.message}`);
                    throw new Error(data.message || '请求失败');
                }
            } catch (error) {
                if (error.message.includes('Failed to fetch') || error.name === 'TypeError') {
                    console.error(`❌ [AM ${requestId}] 网络连接失败: ${API_BASE}`);
                    console.error('❌ 请确认后端服务已启动: cd backend && python app.py');
                    throw new Error(`无法连接到后端服务（${API_BASE}），请确认后端是否已启动`);
                }
                console.error(`❌ [AM ${requestId}] 请求失败: ${error.message}`);
                throw error;
            }
        }

        function showToast(message, type = 'info') {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = message;
            document.body.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
        }

        // ===== 管理员登录 =====
        async function handleAdminLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            errorEl.textContent = '';
            if (!username || !password) {
                errorEl.textContent = '请输入账号和密码';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '验证中...';

            try {
                const resp = await apiCall('/auth/login', {
                    method: 'POST',
                    body: { username, password }
                });

                const userData = resp.data;
                if (!userData.is_admin) {
                    errorEl.textContent = '❌ 该账号不是管理员，无权访问后台';
                    loginBtn.disabled = false;
                    loginBtn.textContent = '验证身份';
                    return;
                }

                // 保存 token 和管理员信息
                setAdminToken(userData.token);
                setAdminInfo({
                    user_id: userData.user_id,
                    username: userData.username,
                    name: userData.name
                });

                console.log(`✅ [登录成功] 管理员 ${username} 已验证身份`);
                showToast(`✅ 欢迎，${userData.name || username}！`, 'success');

                // 显示管理界面
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('managementArea').classList.add('visible');
                document.getElementById('adminInfo').textContent = `👤 ${userData.name || username}`;

                // 加载数据
                loadUsers();

            } catch (e) {
                console.error(`❌ [登录失败] ${e.message}`);
                if (e.message.includes('账号或密码错误')) {
                    errorEl.textContent = '❌ 账号或密码错误';
                } else if (e.message.includes('无法连接到后端')) {
                    errorEl.textContent = '❌ 无法连接到后端服务';
                } else {
                    errorEl.textContent = `❌ ${e.message}`;
                }
                loginBtn.disabled = false;
                loginBtn.textContent = '验证身份';
            }
        }

        function handleAdminLogout() {
            clearAdminToken();
            clearAdminInfo();
            document.getElementById('managementArea').classList.remove('visible');
            document.getElementById('loginOverlay').classList.remove('hidden');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('loginError').textContent = '';
            showToast('已退出登录', 'info');
        }

        // 回车登录
        document.getElementById('loginPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleAdminLogin();
        });
        document.getElementById('loginUsername').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleAdminLogin();
        });

        async function loadUsers() {
            try {
                const resp = await apiCall('/admin/users');
                const data = resp.data;
                const tbody = document.getElementById('userTableBody');
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无账号</td></tr>';
                    return;
                }
                const roleMap = { 'father': '爸爸', 'mother': '妈妈', 'son': '儿子', 'daughter': '女儿' };
                // 过滤掉仅用于后台登录的管理账号（id=1）
                const familyUsers = data.filter(u => u.id !== 1);
                tbody.innerHTML = familyUsers.map((u, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><code>${u.username}</code></td>
                        <td>${u.name}</td>
                        <td>${roleMap[u.role] || u.role}</td>
                        <td>${u.max_commitment} 元</td>
                        <td class="action-cell">
                            <button class="btn btn-primary btn-sm" onclick="openEdit(${u.id})">编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error(`❌ [账号管理] 加载用户列表失败:`, e);
                showToast('加载失败: ' + e.message, 'error');
            }
        }

        async function createUser() {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim() || '123456';
            const name = document.getElementById('newName').value.trim();
            const role = document.getElementById('newRole').value;
            const max_commitment = parseFloat(document.getElementById('newMaxCommitment').value) || 100;

            if (!username) { showToast('请输入账号', 'error'); return; }
            if (!name) { showToast('请输入姓名', 'error'); return; }

            try {
                await apiCall('/admin/users', {
                    method: 'POST',
                    body: { username, password, name, role, max_commitment, is_admin: false }
                });
                showToast('✅ 账号创建成功', 'success');
                document.getElementById('newUsername').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('newName').value = '';
                loadUsers();
            } catch (e) {
                console.error(`❌ [账号管理] 创建用户失败:`, e);
                showToast('创建失败: ' + e.message, 'error');
            }
        }

        function openEdit(userId) {
            // 从表格中获取数据（简化处理，重新请求）
            fetchUserAndOpenEdit(userId);
        }

        async function fetchUserAndOpenEdit(userId) {
            try {
                const resp = await apiCall('/admin/users');
                const user = resp.data.find(u => u.id === userId);
                if (!user) { showToast('用户不存在', 'error'); return; }
                document.getElementById('editUserId').value = userId;
                document.getElementById('editUsername').value = user.username;
                document.getElementById('editName').value = user.name;
                document.getElementById('editRole').value = user.role;
                document.getElementById('editMaxCommitment').value = user.max_commitment;
                document.getElementById('editPassword').value = '';
                document.getElementById('editModal').classList.add('open');
            } catch (e) {
                console.error(`❌ [账号管理] 加载用户 ${userId} 编辑信息失败:`, e);
                showToast('加载失败: ' + e.message, 'error');
            }
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('open');
        }

        async function saveEdit() {
            const userId = parseInt(document.getElementById('editUserId').value);
            const username = document.getElementById('editUsername').value.trim();
            const name = document.getElementById('editName').value.trim();
            const role = document.getElementById('editRole').value;
            const max_commitment = parseFloat(document.getElementById('editMaxCommitment').value) || 0;
            const password = document.getElementById('editPassword').value.trim();

            if (!username) { showToast('请输入账号', 'error'); return; }
            if (!name) { showToast('请输入姓名', 'error'); return; }

            try {
                const body = { username, name, role, max_commitment };
                if (password) body.password = password;
                await apiCall(`/admin/users/${userId}`, {
                    method: 'PUT',
                    body
                });
                showToast('✅ 修改成功', 'success');
                closeModal();
                loadUsers();
            } catch (e) {
                console.error(`❌ [账号管理] 修改用户 ${userId} 失败:`, e);
                showToast('修改失败: ' + e.message, 'error');
            }
        }

        async function deleteUser(userId) {
            if (!confirm('确定要删除该账号吗？此操作不可撤销！')) return;
            try {
                await apiCall(`/admin/users/${userId}`, { method: 'DELETE' });
                showToast('✅ 删除成功', 'success');
                loadUsers();
            } catch (e) {
                console.error(`❌ [账号管理] 删除用户 ${userId} 失败:`, e);
                showToast('删除失败: ' + e.message, 'error');
            }
        }

        // 点击模态框外部关闭
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ===== 初始化 =====
        (async function init() {
            // 启动时检测后端连接
            console.log(`🔍 [启动检测] 正在检测后端连接: ${API_BASE}/ping`);
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const resp = await fetch(`${API_BASE}/ping`, {
                    method: 'GET',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (!resp.ok) {
                    console.warn(`⚠️ [启动检测] 后端状态异常 (${resp.status})`);
                    document.getElementById('loginError').textContent = '⚠️ 后端服务状态异常，请稍后重试';
                }
            } catch (err) {
                console.error(`❌ [启动检测] 无法连接到后端: ${API_BASE}`);
                console.error('❌ 请确认后端已启动: cd backend && python app.py');
                document.getElementById('loginError').textContent =
                    err.name === 'AbortError' ? '⏰ 后端连接超时（5秒）' : '🌐 无法连接到后端服务';
                return;
            }

            // 检查是否有已保存的登录状态
            const savedToken = getAdminToken();
            const savedInfo = getAdminInfo();
            if (savedToken && savedInfo) {
                console.log(`🔑 [已登录] 检测到已保存的登录状态: ${savedInfo.username}`);
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('managementArea').classList.add('visible');
                document.getElementById('adminInfo').textContent = `👤 ${savedInfo.name || savedInfo.username}`;
                loadUsers();
            }
            // 否则保持登录界面显示
        })();
    </script>
</body>
</html>
